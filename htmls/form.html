<!DOCTYPE html>
<html lang="eu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamestop formulario</title>
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <!-- form.css el último, para que el menú responsive gane a header.css -->
    <link rel="stylesheet" href="../css/form.css">
    <link rel="icon" type="image/x-icon" href="../asset/logo.png">
</head>

<body>

<!-- Menu desplegable (móvil/tablet)-->
<input type="checkbox" id="btn-menu">

<div class="barra-movil">
    <label for="btn-menu" aria-label="Menua ireki">☰</label>
    <a href="../index.html"><img src="../asset/izen-logo.png" alt="GameStop"></a>
</div>

<div class="container-menu">
    <label for="btn-menu" class="menu-fondo" aria-label="Menua itxi"></label>
    <div class="cont-menu">
        <label for="btn-menu" class="cerrar-menu" aria-label="Menua itxi">✕</label>
        <nav aria-label="Menu nagusia">
            <ul>
                <li><a href="../index.html">Hasiera</a></li>
                <li><a href="./Jokalariak-mini.html">Jokalariak</a></li>
                <li><a href="./albisteak.html">Berriak</a></li>
                <li><a href="./clasifikazio.html">Sailkapena</a></li>
                <li><a href="./form.html">Gurekin kontaktatu</a></li>
            </ul>
        </nav>
    </div>
</div>
<!-- FIN Menu desplegable -->

    <header>
        <div class="header-bilatzailea">
            <div class="logoa"><a href="../index.html"><img src="../asset/izen-logo.png" alt="GameStop"></a></div>
            <div class="nabegatzailea">
                <a href="./Jokalariak-mini.html">
                    <h2>JOKALARIAK</h2>
                </a>
                <a href="../htmls/albisteak.html">
                    <h2>BERRIAK</h2>
                </a>
                <a href="../htmls/clasifikazio.html">
                    <h2>SAILKAPENA</h2>
                </a>
                <a href="../htmls/form.html">
                    <h2 id="hemen">GUREKIN KONTAKTATU</h2>
                </a>
            </div>
        </div>
        <hr class="nabegatzaile-lerroa">
    </header>

    <main>
        <form>
            <fieldset>
                <legend>
                    <h1>Harremanetarako formularioa</h1>
                </legend>

                <div class="izenabizen">
                    <div class="eremua">
                        <label for="izen">Izena:<span class="derrigorra"> *</span></label>
                        <input type="text" required id="izen" name="izen" placeholder="Izena" autocomplete="given-name">
                    </div>

                    <div class="eremua">
                        <label for="abizen">Abizena:<span class="derrigorra"> *</span></label>
                        <input type="text" required id="abizen" name="abizen" placeholder="Abizena" autocomplete="family-name">
                    </div>
                </div>

                <div class="eremua">
                    <label for="email">Email helbidea:<span class="derrigorra"> *</span></label>
                    <input type="email" id="email" required name="email" placeholder="eredu@email.com" autocomplete="email">
                </div>

                <div class="eremua">
                    <label for="kontaktu">Kontaktuaren zergatik:<span class="derrigorra"> *</span></label>
                    <textarea id="kontaktu" required name="kontaktu" rows="7"></textarea>
                </div>

                <hr>

                <div class="eremua">
                    <label for="comentarioak">Komentarioa:</label>
                    <textarea id="comentarioak" name="comentarioak" rows="7"></textarea>
                </div>

                <label for="newsletter" class="newsletterlabel">
                    <input type="checkbox" id="newsletter" name="newsletter" value="Bai" class="newsletter">
                    Newsletter-era harpidetu
                </label>

                <input type="submit" value="Bidali formularioa">
            </fieldset>
        </form>
    </main>

    <footer>
        <hr class="nabegatzaile-lerroa">
        <div class="footer-bilatzailea">
            <div class="logoafooter"><img src="../asset/logo.png" alt="Logo de GameStop"></div>
            <div class="informazioafooter">
                <p>
                <h2>© 1999-2026 GameStop™ eta AIA S.A.™</h2>
                </p>
            </div>
            <div class="saresozialak">
                <a href="https://www.instagram.com/gamestop"><img src="../asset/iglogo.png" alt="Instagram"></a>
                <a href="https://www.facebook.com/GameStop/"><img src="../asset/facebooklogo.png" alt="Facebook"></a>
                <a href="https://x.com/GameStop"><img src="../asset/xlogo.png" alt="Twitter"></a>
                <a href="https://www.youtube.com/channel/UCX1aoT25QZzgGQJo4uCtRxw"><img src="../asset/ytlogo.png"
                        alt="YouTube"></a>
            </div>
        </div>
    </footer>

<script>
    // Cierra el menú al pulsar Escape o al volver a la página con el botón "atrás"
    const chkMenu = document.getElementById('btn-menu');
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') chkMenu.checked = false; });
    window.addEventListener('pageshow', () => { chkMenu.checked = false; });
</script>
</body>

</html>
