<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Gamestop formulario</title>
    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
</head>


<body>

    <header>
        <div class="logoa"><a href="../index.html"><img src="../asset/izen-logo.png"></a></div>
        <div class="nabegatzailea">
            <a href="../htmls/players.html">
                <h2>PARTE-HARTZAILEAK</h2>
            </a>
            <a href="#">
                <h2>BERRIAK</h2>
            </a>
            <a href="../htmls/clasifikazio.html">
                <h2>SAILKAPENA</h2>
            </a>
            <a href="../htmls/form.html">
                <h2>GUREKIN KONTAKTATU</h2>
            </a>
        </div>
    </header>

    <main>
        
        <form>
            <fieldset>
                <legend><h1>Harremanetarako formularioa</h1></legend>
                <div class="izenabizen">
                    <div class="izen">
                        <label for="izen"><h4>Izena:</h4></label>
                        <e> *</e><br>
                        <input type="text" required id="izen" name="izen" placeholder="Izena"><br>
                    </div>
                    <div class="abizen">
                        <label for="abizen"><h4>Abizena:</h4></label>
                        <e> *</e><br>
                        <input type="text" required id="abizen" name="abizen" placeholder="Abizena"><br>
                    </div>
                </div>
                <br>
                <label for="email"><h4>Email helbidea:</h4></label>
                <e> *</e><br>
                <input type="email" id="email" required name="email" placeholder="eredu@email.com"><br>
                <br>
                <label for="kontaktu"><h4>Kontaktuaren zergatik:</h4></label>
                <e> *</e><br>
                <textarea id="kontaktu" required name="kontaktu" rows="7" cols="99%"></textarea><br>
                <br>
                <hr>
                <label for="comentarioak"><h4>Komentarioa:</h4></label><br>
                <textarea id="comentarioak" name="comentarioak" rows="7" cols="99%"></textarea><br>
                <br>
                <input type="checkbox" id="newsletter" name="newsletter" value="Bai">
                <label for="newsletter"><h4>Newsletterra harpidetu?</h4></label><br>
                <br>
                <input type="submit" value="Bidali formularioa">
            </fieldset>
        </form>
    </main>

</body>

</html>
